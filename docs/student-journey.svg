  <g font-family="Arial, Liberation Sans, sans-serif" font-size="16" text-anchor="middle" fill="#20202a">
    <text x="380" y="54"><tspan x="380">View fictional</tspan><tspan x="380" dy="19">consultation times</tspan></text>
    <text x="380" y="161">Choose a slot and select Book</text>
    <text x="380" y="278"><tspan x="380">Is the slot still</tspan><tspan x="380" dy="19">available?</tspan></text>
    <text x="278" y="438"><tspan x="278">Booking appears in</tspan><tspan x="278" dy="19">Demo bookings</tspan></text>
    <text x="526.5" y="438"><tspan x="526.5">Show conflict and</tspan><tspan x="526.5" dy="19">refresh availability</tspan></text>
    <text x="278" y="585">Manage booking</text>
    <text x="150" y="760"><tspan x="150">Confirm</tspan><tspan x="150" dy="19">cancellation?</tspan></text>
    <text x="463" y="729"><tspan x="463">Choose a new slot</tspan><tspan x="463" dy="19">and select Move here</tspan></text>
    <text x="463" y="865"><tspan x="463">Is the new slot</tspan><tspan x="463" dy="19">still available?</tspan></text>
    <text x="150" y="909"><tspan x="150">Cancel booking</tspan><tspan x="150" dy="19">and free the slot</tspan></text>
    <text x="405" y="1021"><tspan x="405">Move the booking</tspan><tspan x="405" dy="19">and free the old slot</tspan></text>
    <text x="621" y="1021"><tspan x="621">Keep original booking</tspan><tspan x="621" dy="19">and refresh times</tspan></text>
  </g>
