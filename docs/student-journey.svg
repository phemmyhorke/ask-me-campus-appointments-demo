<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1124" viewBox="0 0 760 1124" role="img" aria-labelledby="title desc">
  <title id="title">Student appointment journey</title>
  <desc id="desc">View fictional consultation times and choose a slot. If it is no longer available, refresh and choose again. A confirmed booking can be cancelled or rescheduled. A successful move frees the old slot; an unsuccessful move keeps the original booking.</desc>
